    <!-- Google tag (gtag.js) — cookieless via Consent Mode v2 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1SGTJKG3T7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Consent Mode v2 — storage stays denied, so GA4 never sets cookies.
      // It still sends cookieless, consent-aware pings (Consent Mode modeling).
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted'
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);

      gtag('config', 'G-1SGTJKG3T7');
    </script>
